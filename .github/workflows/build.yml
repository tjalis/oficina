name: Gerar app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gerar-app
  cancel-in-progress: true

jobs:
  site:
    name: Site (app instalável)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: www
          path: www
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

  pages:
    name: Publicar site
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  windows:
    name: Windows (.exe)
    needs: site
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: www
          path: desktop/www
      - name: Ícone
        shell: bash
        run: cp app/icons/icon-256.png desktop/icon.png
      - name: Gerar .exe
        working-directory: desktop
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            desktop/dist/OficinaAR-Instalador.exe
            desktop/dist/OficinaAR-Portatil.exe

  android:
    name: Android (.apk)
    needs: site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v4
        with:
          name: www
          path: mobile/www
      - name: Preparar projeto Android
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          npx cap add android
      - name: Ícones
        working-directory: mobile
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#C8102E' --splashBackgroundColor '#F6F3F3'
      - name: Gerar .apk
        working-directory: mobile
        run: |
          npx cap sync android
          mkdir -p ~/.android
          cp assinatura.keystore ~/.android/debug.keystore
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../OficinaAR.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: mobile/OficinaAR.apk

  versao:
    name: Página de downloads
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: saida
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Versão ${{ github.run_number }}
          make_latest: true
          body: Baixe pelo site do app, na página "baixar.html".
          files: |
            saida/OficinaAR-Instalador.exe
            saida/OficinaAR-Portatil.exe
            saida/OficinaAR.apk
