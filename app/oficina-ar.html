<title>Registros de Serviço A.R</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<script>
(function(){ var t=null; try{ t=localStorage.getItem('ar-tema'); }catch(_){}
  var mq=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)');
  function aplicar(){ var e=t||(mq&&mq.matches?'escuro':'claro'); document.documentElement.setAttribute('data-tema',e);
    var m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute('content',e==='escuro'?'#8E0D23':'#C8102E'); }
  aplicar(); if(mq&&mq.addEventListener) mq.addEventListener('change',function(){ if(!t) aplicar(); });
  window.arTema=function(){ t=document.documentElement.getAttribute('data-tema')==='escuro'?'claro':'escuro'; try{ localStorage.setItem('ar-tema',t); }catch(_){} aplicar(); return t; };
})();
</script>
<style>
/* Layout: app de uma coluna feito para o celular — barra vermelha compacta, blocos enxutos, total e ações fixos no rodapé */
:root{
  --red:#C8102E; --red-dark:#9E0B23; --red-soft:#FCE9EC;
  --ink:#1D1B1C; --muted:#6E6669; --line:#ECE4E6; --bg:#FFFFFF; --ground:#F6F3F3;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --g-grade:#EFE7E9; --g-eixo:#CFC4C7; --g-barra:#E3AEB8; --top:var(--red);
  --hover:#FDFAFA; --dash:#D9C9CD; --ok:#1E6B3A; --ok-bg:#E6F3EA; --pop:var(--ink); --pop-ink:#fff; --phone-bg:#E4DADD;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}

/* topo */
.top{background:var(--top);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
.top-in{max-width:600px;margin:0 auto;padding:10px 16px 0;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:baseline;gap:8px}
.mark{font-family:var(--display);font-weight:800;font-size:28px;line-height:1}
.sub{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.07em;text-transform:uppercase;opacity:.92;white-space:nowrap}
.view-toggle{margin-left:auto;align-self:center;display:flex;border:1.5px solid rgba(255,255,255,.7);border-radius:7px;overflow:hidden}
.view-toggle button{border:0;background:transparent;color:#fff;padding:4px 7px;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.view-toggle button[aria-pressed="true"]{background:#fff;color:var(--red)}
.top-in{padding-bottom:10px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:12;background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.tab{background:transparent;border:0;border-radius:12px;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-family:var(--body);font-weight:600;font-size:12px;cursor:pointer}
.tab svg{width:22px;height:22px;flex:none}
.tab[aria-selected="true"]{background:var(--red-soft);color:var(--red);font-weight:700}

main{max-width:600px;margin:0 auto;padding-inline:12px;padding-block:12px 170px;display:flex;flex-direction:column;gap:10px}
.block{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.doc-line{display:flex;justify-content:space-between;align-items:center;padding:0 4px;font-size:13px;color:var(--muted)}
.doc-line b{font-family:var(--mono);color:var(--ink)}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2{margin:0;font-family:var(--display);font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.06em;color:var(--red)}
.sec-head span{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label,.flabel{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:0}
input,select,textarea{width:100%;min-width:0;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);padding:9px 10px;font-size:16px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink);min-height:44px}
input:focus,select:focus,textarea:focus{border-color:var(--red);outline:none}
textarea{resize:vertical;min-height:64px}
.suffix{position:relative;display:block}
.suffix input{padding-right:40px;font-variant-numeric:tabular-nums}
.suffix span{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:14px;font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0;pointer-events:none}
.plate{font-family:var(--mono);font-weight:700;text-transform:uppercase;letter-spacing:.1em}
.err{border-color:var(--red)!important;background:var(--red-soft)!important}

/* veículo em um botão só */
.veh-pick{display:flex;align-items:center;gap:10px;width:100%;min-width:0;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);padding:6px 10px 6px 6px;font-size:16px;font-weight:500;cursor:pointer;text-align:left;min-height:48px;color:var(--ink)}
.veh-pick:hover,.veh-pick:focus-visible{border-color:var(--red)}
.veh-pick .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.veh-pick .nm.ph{color:var(--muted);font-size:15px}
.veh-pick::after{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);flex:none;margin-right:6px}

/* itens */
.items{display:flex;flex-direction:column;gap:8px}
.it{border:1.5px solid var(--line);border-radius:10px;padding:8px;display:grid;grid-template-columns:1fr auto;gap:6px 8px}
.it input{min-height:40px;padding:7px 9px}
.it-nums{grid-column:1/-1;display:grid;grid-template-columns:58px 12px minmax(0,1fr) auto;gap:6px;align-items:center}
.it-nums .mul{text-align:center;color:var(--muted);font-size:14px}
.it-nums input{text-align:right;font-variant-numeric:tabular-nums}
.it-tot{font-family:var(--mono);font-weight:700;font-size:14px;text-align:right;white-space:nowrap;min-width:84px}
.del{width:40px;height:40px;border:0;border-radius:8px;background:var(--ground);color:var(--muted);cursor:pointer;font-size:20px;line-height:1}
.del:hover{color:var(--red)}
.add{border:1.5px dashed var(--red);background:var(--bg);color:var(--red);border-radius:10px;min-height:44px;font-weight:600;cursor:pointer;font-size:15px}
.add:hover{background:var(--red-soft)}

/* botões */
.btn{border:1.5px solid var(--red);background:var(--bg);color:var(--red);border-radius:10px;padding:0 16px;min-height:44px;font-weight:600;cursor:pointer;font-size:15px;white-space:nowrap}
.btn:hover{background:var(--red-soft)}
.btn.solid{background:var(--red);color:#fff}
.btn.solid:hover{background:var(--red-dark)}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.btn[aria-busy="true"]{opacity:.6;cursor:progress}
.linkbtn{border:0;background:none;color:var(--red);font-size:14px;font-weight:600;cursor:pointer;padding:6px 2px;min-height:32px}
.linkbtn.mut{color:var(--muted)}
.linkbtn:hover{text-decoration:underline;text-underline-offset:3px}

/* rodapé fixo */
.dock{position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);padding:10px 12px;z-index:10;box-shadow:0 -6px 20px rgba(120,10,30,.07)}
.dock-in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:8px}
.dock-total{flex:1;min-width:0}
.dock-total small{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.dock-total b{font-family:var(--mono);font-size:19px;color:var(--red);font-variant-numeric:tabular-nums;white-space:nowrap}

/* salvos */
.search{display:flex;gap:8px}
.search input{flex:1}
.filt-btn{display:flex;align-items:center;gap:6px;padding:0 12px}
.filt-btn span:not(:empty){background:var(--red);color:#fff;border-radius:10px;font-size:12px;padding:1px 7px}
.filt-btn[aria-expanded="true"]{background:var(--red-soft)}
.list-bar{display:flex;justify-content:space-between;align-items:center;gap:6px 10px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding:0 4px}
.list-bar b{color:var(--ink);font-variant-numeric:tabular-nums}
.list-bar-r{display:flex;align-items:center;gap:10px}
.sort select{width:auto;min-height:36px;padding:5px 8px;font-size:14px}
.sort{flex-direction:row;align-items:center;gap:6px}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card-main{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 12px;width:100%;border:0;background:none;text-align:left;cursor:pointer}
.card-main:hover{background:var(--hover)}
.card .who{font-weight:600;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .val{font-family:var(--mono);font-weight:700;color:var(--red);text-align:right}
.card .veh{grid-column:1/-1;color:var(--ink);font-size:14px;display:flex;gap:8px;align-items:center;min-width:0}
.card .veh span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .meta{grid-column:1/-1;color:var(--muted);font-size:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mini-plate{font-family:var(--mono);font-weight:700;font-size:11px;border:1.5px solid var(--ink);border-top:3px solid #1a3e8c;border-radius:3px;padding:0 5px;letter-spacing:.08em;flex:none}
.badge{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ok);background:var(--ok-bg);border-radius:4px;padding:1px 6px}
.card-acts{display:flex;border-top:1px solid var(--line)}
.card-acts button{flex:1;border:0;background:none;min-height:40px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.card-acts button+button{border-left:1px solid var(--line)}
.card-acts button:hover{color:var(--red);background:var(--hover)}
.confirm{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--red-soft);padding:8px 12px;font-size:14px}
.confirm div{display:flex;gap:8px}
.confirm .btn{min-height:36px;padding:0 12px}
.empty{text-align:center;color:var(--muted);padding:32px 16px;background:var(--bg);border:1.5px dashed var(--line);border-radius:12px}

/* janelas de escolha */
.picker{position:fixed;inset:0;background:rgba(29,27,28,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.picker-card{background:var(--bg);width:100%;max-width:560px;max-height:88%;border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:700px){html:not(.phone) .picker{align-items:center}html:not(.phone) .picker-card{border-radius:16px;max-height:80%}}
.picker-head{padding:12px 14px 10px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.picker-head .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.steps button{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps button[aria-current="step"]{border-color:var(--red);color:var(--red);background:var(--red-soft)}
.steps button:disabled{opacity:.45;cursor:not-allowed}
.picker-grid{overflow:auto;padding:12px 14px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.picker-grid.txt{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.btile{border:1.5px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-size:13px;font-weight:600;text-align:center;min-width:0}
.btile.t{padding:12px 8px;justify-content:center;min-height:52px;font-size:14px}
.btile .blogo{width:46px;height:46px;font-size:16px}
.btile:hover{border-color:var(--red)}
.btile[aria-pressed="true"]{border-color:var(--red);background:var(--red-soft)}
.blogo{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--ground);border:1.5px dashed var(--dash);color:var(--muted);font-family:var(--display);font-weight:700;font-size:13px;overflow:hidden}
.blogo img{width:100%;height:100%;object-fit:contain}
.blogo.empty{background:transparent}
.blogo.img{border:0;background:transparent;border-radius:0}
.other-row{display:flex;gap:8px;padding:0 14px 14px;align-items:center}
.other-row .btn{padding:0 14px}
.x{width:40px;height:40px;border:0;background:var(--ground);border-radius:50%;font-size:20px;cursor:pointer;color:var(--muted);flex:none}

/* pré-visualização */
.sheet-wrap{position:fixed;inset:0;background:rgba(29,27,28,.6);z-index:30;overflow:auto;padding:0 12px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet-bar{max-width:794px;margin:0 auto;display:flex;gap:8px;justify-content:flex-end;position:sticky;top:0;z-index:2;padding:12px 0}
.sheet-bar .btn{box-shadow:0 2px 10px rgba(0,0,0,.2)}
.sheet-bar .btn:not(.solid){background:var(--bg)}
.sheet-fit{margin:0 auto;position:relative}
/* a folha é sempre um A4 (794 x 1123 px a 96 dpi); na tela ela é reduzida para caber */
.sheet{width:794px;height:1123px;background:#fff;container-type:inline-size;position:relative;overflow:hidden}
.pages{position:absolute;left:0;top:0;width:794px;transform-origin:top left;display:flex;flex-direction:column;gap:28px}
.pages .sheet{box-shadow:0 1px 3px rgba(0,0,0,.18),0 10px 34px rgba(0,0,0,.16)}
.render-box{position:fixed;left:-10000px;top:0;width:794px;background:#fff}
.render-box .sheet{box-shadow:none}

/* documento final: registro de serviço, preto e branco para impressão */
.rs{--k:#111111;--m:#555555;--l:#BDBDBD;background:#fff;color:var(--k);font-family:var(--body);font-size:12.5px;line-height:1.4;padding:38px 40px;display:flex;flex-direction:column;height:100%;box-sizing:border-box}
.rs-body{display:flex;flex-direction:column;gap:12px}
.rs-cont{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:2px solid var(--k);padding-bottom:8px}
.rs-cont b{font-family:var(--display);font-weight:800;font-size:22px}
.rs-cont span{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.05em;text-transform:uppercase}
.rs-foot{margin-top:auto;display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--l);padding-top:6px;font-size:10px;color:var(--m)}
.rs-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--k);padding-bottom:12px}
.rs-brand{display:flex;flex-direction:column;gap:3px;min-width:0}
.rs-name{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.rs-ar{font-family:var(--display);font-weight:800;font-size:42px;line-height:.9}
.rs-of{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.06em;text-transform:uppercase}
.rs-addr{font-size:11px}
.rs-cnpj{display:inline-block;min-width:160px;border-bottom:1px solid var(--k)}
.rs-title{text-align:right;margin-left:auto}
.rs-title .t{font-family:var(--display);font-weight:700;font-size:23px;letter-spacing:.05em;text-transform:uppercase;line-height:1}
.rs-title .n{font-family:var(--mono);font-size:15px;font-weight:700;margin-top:5px}
.rs-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));border-top:1px solid var(--k);border-left:1px solid var(--k)}
.rs-grid>div{border-right:1px solid var(--k);border-bottom:1px solid var(--k);padding:4px 8px;min-width:0}
.rs-grid small{display:block;font-size:8.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--m);font-weight:600}
.rs-grid b{display:block;font-size:12.5px;font-weight:600;overflow-wrap:anywhere}
.rs .c1{grid-column:span 1}.rs .c2{grid-column:span 2}.rs .c4{grid-column:span 4}.rs .c6{grid-column:span 6}
.rs .mono{font-family:var(--mono)}
.rs-tbl{border:1px solid var(--k)}
.rs table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;table-layout:fixed}
.rs th{color:var(--k);text-align:left;padding:6px 8px;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;border-bottom:1.5px solid var(--k)}
.rs td{padding:6px 8px;border-bottom:1px solid var(--l);font-size:11.5px;vertical-align:top}
.rs tbody tr:last-child td{border-bottom:0}
.rs th.i{width:34px}.rs td.i{color:var(--m);font-family:var(--mono);font-size:10.5px}
.rs td.d{overflow-wrap:anywhere;word-break:break-word}
.rs th.tp{width:72px}.rs th.v{width:104px}
.rs td.tp{color:var(--m);font-size:10.5px}
.rs th.q,.rs td.q{width:46px}
.rs td.n,.rs th.n{text-align:right;white-space:nowrap}
.rs td.n{font-family:var(--mono);font-size:11.5px}
.rs td.n.t{font-weight:700}
.rs-sum{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.25fr);border-top:1px solid var(--k);border-left:1px solid var(--k)}
.rs-sum>div{border-right:1px solid var(--k);border-bottom:1px solid var(--k);padding:5px 9px;min-width:0}
.rs-sum small{display:block;font-size:8.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--m);font-weight:600}
.rs-sum b{display:block;font-family:var(--mono);font-size:13px;font-weight:700}
.rs-sum .tot{border-left:1px solid var(--k);border-top:1px solid var(--k);border-right-width:2px!important;border-bottom-width:2px!important}
.rs-sum .tot b{font-size:19px}
.rs-sum .ext{grid-column:1/-1}
.rs-sum .ext b{font-family:var(--body);font-style:italic;font-weight:600;font-size:12.5px}
.rs-obs{border:1px solid var(--k);padding:5px 8px;font-size:11.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.rs-obs small{display:block;font-size:8.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--m);font-weight:600;white-space:normal}
@container (max-width:560px){
  .rs{padding:18px 14px}
  .rs-title{text-align:left;margin-left:0}
  .rs-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .rs .c6,.rs .c2,.rs .c4{grid-column:span 4}
  .rs .c1{grid-column:span 2}
}

.confirm{border-radius:10px}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--pop);color:var(--pop-ink);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:calc(100% - 32px);text-align:center;display:flex;align-items:center;gap:6px}
.toast[hidden]{display:none}
.toast .t-acao{border:0;background:transparent;color:#FF9AAB;font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase;min-height:40px;padding:0 8px;cursor:pointer;flex:none}

/* arrastar para apagar */
.it-wrap{position:relative;border-radius:10px;overflow:hidden}
.it-wrap>.it{position:relative;background:var(--bg);touch-action:pan-y;transition:transform .18s ease}
.it-wrap.arrastando>.it{transition:none}
.it-bg{position:absolute;inset:0;padding-right:20px;align-items:flex-end!important;background:var(--red);opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff;font-weight:700;font-size:13px}
.it-bg svg{width:20px;height:20px}
.it-wrap.arrastando .it-bg,.it-wrap.saindo .it-bg{opacity:1}
.dica-arr{margin:0;font-size:12px;color:var(--muted)}
@media (pointer:coarse){ .it .del{display:none} .it{grid-template-columns:1fr} }
@media (pointer:fine){ .dica-arr{display:none} }

/* rascunho automático */
.rasc{border:2px solid var(--red)}
.rasc-h{display:flex;align-items:center;gap:8px;color:var(--red)}
.rasc-h b{color:var(--ink);font-size:17px}
.rasc-veh{font-size:15px}
.rasc-info{font-size:13px;color:var(--muted)}
.rasc-acts{display:flex;gap:8px}
.rasc-acts .btn:first-child{flex:1}
.rasc-ok{display:block;font-style:normal;color:var(--ok);font-weight:600;font-size:12px}

/* resumo mensal */
.res-head{display:flex;align-items:center;justify-content:space-between;gap:8px}

.kpi small{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kpi b{font-family:var(--mono);font-size:19px;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.kpi.main{grid-column:1/-1;border-color:var(--red)}

.kpi.n{grid-column:1/-1}
.sec-head{flex-wrap:wrap}
.sub-mut{font-family:var(--body)!important;font-weight:500!important;font-size:12px!important;color:var(--muted)!important}
.graf{position:relative}

.graf .tip{position:absolute;pointer-events:none;background:var(--pop);color:var(--pop-ink);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.45;white-space:nowrap;transform:translate(-50%,-100%);z-index:2}

.graf .hit:focus{outline:none}

.res-lista{display:flex;flex-direction:column}
.res-row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:9px 4px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}

.res-row:hover{background:var(--hover)}
.res-row .dt{font-family:var(--mono);font-size:12px;color:var(--muted)}
.res-row .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.res-nota{margin:0;font-size:12px;color:var(--muted);padding:0 4px}

const versoesDe=(marca,modelo)=>VERSOES[marca+'|'+modelo]||MOTORES;


const veiculo = o => [o.marca,o.modelo,o.versao].filter(Boolean).join(' ');
function proxNum(){ return lista.reduce((m,o)=>Math.max(m,o.num||0),0)+1; }
function novo(){
  atual = {id:uid(),num:proxNum(),data:hoje(),nome:'',placa:'',marca:'',modelo:'',versao:'',ano:'',km:'',obs:'',
    itens:[{id:uid(),tipo:'peca',desc:'',qtd:1,unit:0},{id:uid(),tipo:'serv',desc:'',qtd:1,unit:0}]};
  carregar();
}
function totais(o){
  let pecas=0,serv=0;
  o.itens.forEach(i=>{ const t=(i.qtd||0)*(i.unit||0); i.tipo==='serv'?serv+=t:pecas+=t; });
  return {pecas,serv,total:pecas+serv};
}
const fmtKm=v=>{ const d=String(v||'').replace(/\D/g,'').replace(/^0+(?=\d)/,'').slice(0,7); return d?Number(d).toLocaleString('pt-BR'):''; };
function fmtPlaca(p){ p=(p||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,7); return /^[A-Z]{3}\d{4}$/.test(p)?p.slice(0,3)+'-'+p.slice(3):p; }

function carregar(){
  $('#f-nome').value=atual.nome; $('#f-data').value=atual.data; $('#f-placa').value=fmtPlaca(atual.placa);
  $('#f-ano').value=atual.ano||''; atual.km=fmtKm(atual.km); $('#f-km').value=atual.km; $('#f-obs').value=atual.obs||'';
  $('#doc-num').textContent='Nº '+pad(atual.num);
  document.querySelectorAll('.err').forEach(e=>e.classList.remove('err'));
  renderVeic(); renderItens(); renderSums(); agendarLive();
}
function renderVeic(){
  agendarLive();
  const v=veiculo(atual);
  $('#f-veic').innerHTML=logo(atual.marca)+`<span class="nm${v?'':' ph'}">${v?esc(v):'Fabricante, modelo e versão'}</span>`;
}
function itemHtml(i){
  const ph=i.tipo==='serv'?'Ex.: Troca de óleo e filtro':'Ex.: Filtro de óleo';
  return `<div class="it-wrap" data-id="${i.id}"><div class="it-bg" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>Apagar</div><div class="it" data-id="${i.id}">
    <input id="d-${i.id}" data-f="desc" value="${esc(i.desc)}" placeholder="${ph}" aria-label="Descrição">
    <button class="del" aria-label="Remover item">×</button>
    <div class="it-nums">
      <input id="q-${i.id}" data-f="qtd" inputmode="decimal" value="${i.qtd||''}" aria-label="Quantidade">
      <span class="mul">×</span>
      <input id="u-${i.id}" data-f="unit" inputmode="decimal" value="${fmtIn(i.unit)}" placeholder="R$ 0,00" aria-label="Valor unitário">
      <b class="it-tot">${brl((i.qtd||0)*(i.unit||0))}</b>
    </div></div></div>`;
}
function renderItens(){
  ['peca','serv'].forEach(t=>{ const l=atual.itens.filter(i=>(i.tipo==='serv'?'serv':'peca')===t);
    $('#items-'+t).innerHTML=l.map(itemHtml).join('')+(l.length?'<p class="dica-arr">Arraste um item para a esquerda para apagar.</p>':''); });
}
function renderSums(){
  const t=totais(atual);
  $('#sub-peca').textContent=t.pecas?brl(t.pecas):''; $('#sub-serv').textContent=t.serv?brl(t.serv):'';
  $('#dock-total').textContent=brl(t.total);
}

// eventos do formulário
$('#f-nome').addEventListener('input',e=>{atual.nome=e.target.value;e.target.classList.remove('err');});
$('#f-obs').addEventListener('input',e=>atual.obs=e.target.value);
$('#f-data').addEventListener('change',e=>{ atual.data=e.target.value||hoje(); });
$('#f-ano').addEventListener('change',e=>{atual.ano=e.target.value;e.target.classList.remove('err');});
$('#f-placa').addEventListener('input',e=>{atual.placa=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,7);e.target.classList.remove('err');});
$('#f-placa').addEventListener('blur',e=>e.target.value=fmtPlaca(atual.placa));
$('#f-km').addEventListener('input',e=>{ const el=e.target, antes=el.value.slice(0,el.selectionStart).replace(/\D/g,'').length;
  atual.km=fmtKm(el.value); el.value=atual.km;
  let pos=0,n=0; while(pos<el.value.length && n<antes){ if(/\d/.test(el.value[pos])) n++; pos++; } try{ el.setSelectionRange(pos,pos); }catch(_){} });

['#items-peca','#items-serv'].forEach(sel=>{
  const box=$(sel);
  box.addEventListener('input',e=>{
    const row=e.target.closest('.it'); if(!row) return;
    const it=atual.itens.find(i=>i.id===row.dataset.id), f=e.target.dataset.f;
    if(f==='desc') it.desc=e.target.value; else it[f]=num(e.target.value);
    row.querySelector('.it-tot').textContent=brl((it.qtd||0)*(it.unit||0));
    renderSums();
  });
  box.addEventListener('focusout',e=>{
    if(e.target.dataset.f==='unit'){ const it=atual.itens.find(i=>i.id===e.target.closest('.it').dataset.id); e.target.value=fmtIn(it.unit); }
  });
  box.addEventListener('click',e=>{
    if(!e.target.closest('.del')) return;
    apagarItem(e.target.closest('.it').dataset.id);
  });
  // arrastar o item para a esquerda e soltar apaga (com Desfazer)
  let arr=null;
  box.addEventListener('pointerdown',e=>{
    const w=e.target.closest('.it-wrap'); if(!w || e.pointerType==='mouse') return;   // só no toque
    arr={w,it:w.querySelector('.it'),x:e.clientX,y:e.clientY,dx:0,ativo:false,id:e.pointerId};
  });
  box.addEventListener('pointermove',e=>{
    if(!arr||e.pointerId!==arr.id) return;
    const dx=e.clientX-arr.x, dy=e.clientY-arr.y;
    if(!arr.ativo){ if(Math.abs(dx)>12 && Math.abs(dx)>Math.abs(dy)*1.3 && dx<0){ arr.ativo=true; arr.w.classList.add('arrastando'); try{arr.w.setPointerCapture(e.pointerId);}catch(_){} document.activeElement?.blur?.(); } else if(Math.abs(dy)>12){ arr=null; return; } else return; }
    arr.dx=Math.min(0,dx); arr.it.style.transform=`translateX(${arr.dx}px)`;
  });
  const soltar=()=>{
    if(!arr) return; const a=arr; arr=null; if(!a.ativo) return;
    a.w.classList.remove('arrastando');
    if(a.dx< -Math.min(120,a.w.offsetWidth*.35)){ a.w.classList.add('saindo'); a.it.style.transform='translateX(-110%)'; setTimeout(()=>apagarItem(a.w.dataset.id),160); }
    else a.it.style.transform='';
  };
  box.addEventListener('pointerup',soltar); box.addEventListener('pointercancel',soltar);
});
function apagarItem(id){
  const pos=atual.itens.findIndex(i=>i.id===id); if(pos<0) return;
  const [it]=atual.itens.splice(pos,1), dono=atual.id;
  renderItens(); renderSums(); agendarLive();
  toast((it.desc.trim()?frase(it.desc):'Item')+' apagado',5000,{rotulo:'Desfazer',fn:()=>{
    if(!atual||atual.id!==dono) return;
    atual.itens.splice(Math.min(pos,atual.itens.length),0,it); renderItens(); renderSums(); agendarLive();
  }});
}
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{
  const it={id:uid(),tipo:b.dataset.add,desc:'',qtd:1,unit:0}; atual.itens.push(it); renderItens(); renderSums();
  document.getElementById('d-'+it.id).focus();
});

function validar(){
  const falta=[];
  if(!atual.nome.trim()){ $('#f-nome').classList.add('err'); falta.push('cliente'); }
  if(!atual.placa){ $('#f-placa').classList.add('err'); falta.push('placa'); }
  if(!atual.marca||!atual.modelo){ $('#f-veic').classList.add('err'); falta.push('veículo'); }
  if(!atual.ano){ $('#f-ano').classList.add('err'); falta.push('ano'); }
  if(!atual.itens.some(i=>i.desc.trim()&&i.unit>0)) falta.push('um item com descrição e valor');
  if(falta.length){ toast('Preencha: '+falta.join(', ')+'.'); return false; }
  return true;
}
function salvar(quieto){
  if(!validar()) return false;
  atual.itens=atual.itens.filter(i=>i.desc.trim()||i.unit);
  const c=JSON.parse(JSON.stringify(atual));
  const idx=lista.findIndex(o=>o.id===c.id);
  idx>=0?lista[idx]=c:lista.unshift(c);
  store.set(lista); renderLista(); renderItens();
  gravar(c); guardarRascunho();
  if(quieto!==true) toast('Registro Nº '+pad(c.num)+' salvo.');
  return true;
}

function extenso(v){
  const U=['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
  const D=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
  const C=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
  const ate999=n=>{ if(n===100) return 'cem'; const p=[], c=Math.floor(n/100), r=n%100; if(c) p.push(C[c]); if(r<20){ if(r) p.push(U[r]); } else { p.push(D[Math.floor(r/10)]); if(r%10) p.push(U[r%10]); } return p.join(' e '); };
  const inteiro=n=>{ const mi=Math.floor(n/1e6), mil=Math.floor(n%1e6/1000), r=n%1000, g=[];
    if(mi) g.push(ate999(mi)+(mi===1?' milhão':' milhões')); if(mil) g.push(mil===1?'mil':ate999(mil)+' mil');
    let txt=g.join(!r&&g.length===2?' e ':' '); if(r){ txt+=(txt?((r<100||r%100===0)?' e ':' '):'')+ate999(r); } return txt; };
  const cent=Math.round((v||0)*100), re=Math.floor(cent/100), ce=cent%100;
  let out='';
  if(re){ out=inteiro(re)+((re%1e6===0)?' de reais':(re===1?' real':' reais')); }
  if(ce){ out+=(out?' e ':'')+ate999(ce)+(ce===1?' centavo':' centavos'); }
  return out?out.charAt(0).toUpperCase()+out.slice(1):'Zero reais';
}


// correção automática de maiúsculas/minúsculas no documento
const SIGLAS=new Set(['ABS','ECU','LED','GNV','ATF','CVT','EGR','DPF','ARLA','PCV','TPMS','EBD','ESP','A/C','AC','4X4','4WD','AWD','DOHC','SOHC','VVT','TSI','TFSI','MPI','GTI','GTS','HGT','RS','SUV','OBD','OBD2','PIX','CNH','IPVA','CPF','CNPJ','RPM','PH','UV','GLP','DOT','DOT3','DOT4','SAE','API','NGK','BMW','VW','GM','JAC','BYD','GWM','RAM','KIA']);
const PARTICULAS=new Set(['de','da','do','das','dos','e','di','du','del','van','von']);
const partes=w=>w.match(/^([^\p{L}\p{N}]*)(.*?)([^\p{L}\p{N}]*)$/u).slice(1);
const capital=w=>w.replace(/\p{L}/u,c=>c.toLocaleUpperCase('pt-BR'));
function palavra(w,inicio){
  const [a,core,z]=partes(w); if(!core) return w;
  const up=core.toLocaleUpperCase('pt-BR');
  if(SIGLAS.has(up)) return a+up+z;
  if(/\d/.test(core) && /\p{L}/u.test(core)) return a+up+z;      // 5W40, G6, 16V
  const low=core.toLocaleLowerCase('pt-BR');
  return a+(inicio?capital(low):low)+z;
}
// frases: só a primeira letra de cada frase em maiúscula
function frase(txt){
  let inicio=true;
  return String(txt||'').split(/(\s+)/).map(t=>{
    if(!t || /^\s+$/.test(t)){ if(/\n/.test(t)) inicio=true; return t; }
    const r=palavra(t,inicio); inicio=/[.!?]["')\]]*$/.test(t); return r;
  }).join('');
}
// nomes de pessoas: cada nome com inicial maiúscula, partículas em minúscula
function nomeProprio(txt){
  let pri=true;
  return String(txt||'').split(/(\s+)/).map(t=>{
    if(!t || /^\s+$/.test(t)) return t;
    const low=t.toLocaleLowerCase('pt-BR'), r=((!pri && PARTICULAS.has(low))||/^\(/.test(low))?low:low.split('-').map(capital).join('-');
    pri=false; return r;
  }).join('');
}

const linhaHtml=(i,k,txt,cont)=>cont
  ? `<tr><td class="i"></td><td class="d">${esc(txt)}</td><td></td><td></td><td></td><td></td></tr>`
  : `<tr><td class="i">${String(k+1).padStart(2,'0')}</td><td class="d">${esc(txt)}</td><td class="tp">${i.tipo==='serv'?'Serviço':'Peça'}</td><td class="n q">${String(i.qtd).replace('.',',')}</td><td class="n">${brl(i.unit)}</td><td class="n t">${brl((i.qtd||0)*(i.unit||0))}</td></tr>`;

const obsHtml=(txt,cont)=>`<div class="rs-obs"><small>Observações${cont?' (continuação)':''}</small>${esc(txt)}</div>`;
// maior trecho do texto que ainda cabe (quebra de preferência num espaço)
function maiorTrecho(txt,cabeCom){
  let lo=0,hi=txt.length;
  while(lo<hi){ const m=Math.ceil((lo+hi)/2); if(cabeCom(txt.slice(0,m))) lo=m; else hi=m-1; }
  if(lo>0 && lo<txt.length){ const sp=txt.lastIndexOf(' ',lo); if(sp>lo*.5) lo=sp; }
  return lo;
}
function paginar(o){
  const t=totais(o), itens=o.itens.filter(i=>i.desc.trim()||i.unit);
  const ord=[...itens.filter(i=>i.tipo!=='serv'),...itens.filter(i=>i.tipo==='serv')];   // peças, depois serviços
  const box=document.createElement('div'); box.className='render-box'; document.body.appendChild(box);
  const folhas=[]; let corpo, tbody=null;
  const nova=()=>{ const sh=document.createElement('div'); sh.className='sheet'; sh.innerHTML='<div class="rs"><div class="rs-body"></div></div>';
    box.appendChild(sh); folhas.push(sh); corpo=sh.querySelector('.rs-body'); tbody=null;
    corpo.insertAdjacentHTML('beforeend', folhas.length===1?cabecHtml(o):contHtml(o)); };
  const cabe=()=>corpo.offsetHeight<=FOLHA_UTIL;
  const por=(alvo,html)=>{ alvo.insertAdjacentHTML('beforeend',html); return alvo.lastElementChild; };
  nova();
  // itens da tabela
  ord.forEach((it,k)=>{
    let txt=frase(it.desc), cont=false, voltas=0;
    while(voltas++<60){
      if(!tbody) tbody=por(corpo,TABELA).querySelector('tbody');
      const tr=por(tbody,linhaHtml(it,k,txt,cont));
      if(cabe()) break;
      const alto=tr.offsetHeight; tr.remove();
      if(alto>160){   // descrição muito longa: o que couber fica nesta folha, o resto segue na próxima
        const n=maiorTrecho(txt,pedaco=>{ const r=por(tbody,linhaHtml(it,k,pedaco,cont)); const ok=cabe(); r.remove(); return ok; });
        if(n>0){ por(tbody,linhaHtml(it,k,txt.slice(0,n),cont)); txt=txt.slice(n).replace(/^\s+/,''); cont=true; if(!txt) break; }
      }
      if(!tbody.children.length) tbody.closest('.rs-tbl').remove();
      nova();
    }
  });
  if(!ord.length){ por(corpo,TABELA).querySelector('tbody').innerHTML='<tr><td colspan="6" style="color:var(--m)">Nenhum item.</td></tr>'; }
  // totais: ficam inteiros numa folha só
  { const el=por(corpo,somaHtml(t)); if(!cabe()){ el.remove(); nova(); por(corpo,somaHtml(t)); } }
  // observações: podem continuar na folha seguinte
  let obs=frase(o.obs||'').trim(), cont=false, voltas=0;
  while(obs && voltas++<60){
    const el=por(corpo,obsHtml(obs,cont)); if(cabe()) break;
    el.remove();
    const n=maiorTrecho(obs,pedaco=>{ const r=por(corpo,obsHtml(pedaco,cont)); const ok=cabe(); r.remove(); return ok; });
    if(n>0){ por(corpo,obsHtml(obs.slice(0,n),cont)); obs=obs.slice(n).replace(/^\s+/,''); cont=true; }
    nova();
  }
  // rodapé com número da página
  const tot=folhas.length;
  folhas.forEach((f,i)=>f.querySelector('.rs').insertAdjacentHTML('beforeend',
    `<div class="rs-foot"><span>A.R. Oficina Mecânica · Registro de serviço Nº ${pad(o.num)}</span><span>${tot>1?`Página ${i+1} de ${tot}`:''}</span></div>`));
  const html=folhas.map(f=>f.outerHTML); box.remove();
  return html;
}

function opcoesFiltro(){
  const sel=(id,vals,todos)=>{ const el=$('#'+id), v=el.value; el.innerHTML=`<option value="">${todos}</option>`+vals.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join(''); if(v&&!vals.includes(v)) el.value=''; };
  sel('ff-marca',[...new Set(lista.map(o=>o.marca).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt')),'Todos');
  sel('ff-ano',[...new Set(lista.map(o=>o.ano).filter(Boolean))].sort((a,b)=>b-a),'Todos');
}
function filtrar(){
  const q=norm($('#busca').value), nome=norm($('#ff-nome').value), veic=norm($('#ff-veic').value);
  const marca=$('#ff-marca').value, ano=$('#ff-ano').value, per=$('#ff-per').value, sit=$('#ff-sit').value;
  const mn=num($('#ff-min').value), mxs=$('#ff-max').value.trim(), mx=num(mxs);
  let de='',ate='';
  if(per==='hoje'){ de=ate=hoje(); } else if(per==='7'){ de=isoDias(6); } else if(per==='30'){ de=isoDias(29); }
  else if(per==='mes'){ de=hoje().slice(0,8)+'01'; } else if(per==='custom'){ de=$('#ff-de').value; ate=$('#ff-ate').value; }
  const r=lista.filter(o=>{
    const t=totais(o).total;
    if(q && !norm(o.nome+' '+o.placa+' '+veiculo(o)+' '+pad(o.num)).includes(q)) return false;
    if(nome && !norm(o.nome).includes(nome)) return false;
    if(veic && !norm(veiculo(o)+' '+o.placa).includes(veic)) return false;
    if(marca && o.marca!==marca) return false;
    if(ano && String(o.ano)!==ano) return false;
    if(de && o.data<de) return false;
    if(ate && o.data>ate) return false;
    if(sit==='exp' && !o.exportado) return false;
    if(sit==='nexp' && o.exportado) return false;
    if(mn && t<mn) return false;
    if(mxs && t>mx) return false;
    return true;
  });
  const T=o=>totais(o).total;
  const cmp={rec:(a,b)=>b.data.localeCompare(a.data)||b.num-a.num, ant:(a,b)=>a.data.localeCompare(b.data)||a.num-b.num,
    maior:(a,b)=>T(b)-T(a), menor:(a,b)=>T(a)-T(b), az:(a,b)=>a.nome.localeCompare(b.nome,'pt'), num:(a,b)=>b.num-a.num}[$('#ff-ord').value];
  return r.sort(cmp);
}
function renderLista(){
  $('#count').textContent=lista.length?'('+lista.length+')':'';
  opcoesFiltro();
  const per=$('#ff-per').value; $('#ff-de-w').hidden=$('#ff-ate-w').hidden=per!=='custom';
  const ativos=FF.filter(id=>{ if((id==='ff-de'||id==='ff-ate')&&per!=='custom') return false; return $('#'+id).value.trim(); }).length;
  $('#filt-n').textContent=ativos||'';
  $('#ff-limpar').hidden=!(ativos||$('#busca').value.trim());
  if(!lista.length){ $('#resumo').textContent=''; $('#lista').innerHTML='<div class="empty">Nenhum registro salvo ainda.<br>Preencha um na aba Registro e toque em Salvar.</div>'; return; }
  const fil=filtrar(), soma=fil.reduce((a,o)=>a+totais(o).total,0);
  $('#resumo').innerHTML=`<b>${fil.length}</b> ${fil.length===1?'registro':'registros'} · <b>${brl(soma)}</b>`;
  if(!fil.length){ $('#lista').innerHTML='<div class="empty">Nenhum registro com esses filtros.</div>'; return; }
  $('#lista').innerHTML=fil.map(o=>`
    <div class="card">
      <button class="card-main" data-id="${o.id}">
        <span class="who">${esc(o.nome)}</span><span class="val">${brl(totais(o).total)}</span>
        <span class="veh"><span class="mini-plate">${esc(fmtPlaca(o.placa))}</span><span>${esc(veiculo(o))} ${esc(o.ano)}</span></span>
        <span class="meta">Nº ${pad(o.num)} · ${dataBR(o.data)}${o.exemplo?'<span class="badge ex">Exemplo</span>':''}${o.exportado?`<span class="badge">${esc(o.exportado.tipo)} em ${dataBR(o.exportado.data)}</span>`:''}</span>
      </button>
      ${apagando===o.id?`<div class="confirm">Apagar este registro?<div><button class="btn solid" data-del="${o.id}">Apagar</button><button class="btn ghost" data-cancel>Cancelar</button></div></div>`
        :`<div class="card-acts"><button data-ver="${o.id}">Ver</button><button data-dup="${o.id}">Duplicar</button><button data-ask="${o.id}">Apagar</button></div>`}
    </div>`).join('');
}
$('#busca').addEventListener('input',renderLista);
FF.concat('ff-ord').forEach(id=>{ const el=$('#'+id); el.addEventListener(el.tagName==='SELECT'||el.type==='date'?'change':'input',renderLista); });
$('#filt-toggle').onclick=()=>{ const f=$('#filtros'); f.hidden=!f.hidden; $('#filt-toggle').setAttribute('aria-expanded',!f.hidden); };
$('#ff-limpar').onclick=()=>{ FF.forEach(id=>$('#'+id).value=''); $('#busca').value=''; renderLista(); };
$('#lista').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.del){ apagarNuvem(b.dataset.del); lista=lista.filter(o=>o.id!==b.dataset.del); apagando=null; store.set(lista); if(atual&&!lista.find(o=>o.id===atual.id)) novo(); renderLista(); toast('Registro apagado.'); return; }
  if(b.dataset.ask){ apagando=b.dataset.ask; renderLista(); return; }
  if(b.dataset.ver){ abrirDoc(lista.find(o=>o.id===b.dataset.ver)); return; }
  if(b.dataset.dup){ duplicar(b.dataset.dup); return; }
  if(b.hasAttribute('data-cancel')){ apagando=null; renderLista(); return; }
  if(b.classList.contains('card-main')) editar(b.dataset.id);
});
function duplicar(id){
  const o=lista.find(x=>x.id===id), c=JSON.parse(JSON.stringify(o));
  c.id=uid(); c.num=proxNum(); c.data=hoje(); delete c.exportado; delete c.exemplo;
  c.itens.forEach(i=>i.id=uid());
  atual=c; carregar(); mostrar('novo'); window.scrollTo(0,0);
  toast('Cópia do Nº '+pad(o.num)+' aberta como Nº '+pad(c.num)+'. Toque em Salvar para guardar.');
}
function editar(id){
  atual=JSON.parse(JSON.stringify(lista.find(x=>x.id===id))); carregar(); mostrar('novo'); window.scrollTo(0,0);
  toast('Editando registro Nº '+pad(atual.num)+'.');
}

// ---------- sincronização entre aparelhos ----------
let col=null; const filas={};
function setSync(st){
  const el=$('#sync'), txt={ok:'Sincronizado',sync:'Sincronizando…',off:'Só neste aparelho',err:'Sem conexão',ro:'Somente leitura'}[st];
  el.className='sync '+st; el.querySelector('.t').textContent=txt; el.title=txt;
}
function erroNuvem(e){
  const c=e&&e.code;
  if(c==='invalid_argument'){ setSync('ro'); toast('Este acesso só permite ver os registros. Peça para ser convidado como editor.'); }
  else if(c==='quota_exceeded') toast('O espaço de registros está cheio. Apague registros antigos para continuar.');
  else { setSync('err'); toast('Sem conexão: o registro ficou salvo só neste aparelho por enquanto.'); }
}
const limpo=o=>JSON.parse(JSON.stringify(o));
function gravar(o){
  if(!col||!o) return Promise.resolve();
  const id=o.id, corpo=limpo(o);
  filas[id]=(filas[id]||Promise.resolve()).then(()=>col.doc(id).set(corpo)).catch(erroNuvem);   // uma gravação por vez em cada registro
  return filas[id];
}
function apagarNuvem(id){
  if(!col) return;
  filas[id]=(filas[id]||Promise.resolve()).then(()=>col.doc(id).delete()).catch(erroNuvem);
}
async function enviarLocais(remotos){
  let feito=false; try{ feito=!!localStorage.getItem('ar-nuvem'); }catch(_){}
  if(feito) return;
  const ids=new Set(remotos.map(r=>r.id)), nums=new Set(remotos.map(r=>r.num));
  let max=remotos.reduce((m,r)=>Math.max(m,r.num||0),0);
  const novos=LOCAIS_INICIAIS.filter(o=>o && !o.exemplo && !ids.has(o.id));
  for(const o of novos){ if(nums.has(o.num)) o.num=++max; else { nums.add(o.num); max=Math.max(max,o.num); } await gravar(o); }
  try{ localStorage.setItem('ar-nuvem','1'); }catch(_){}
  if(novos.length) toast(novos.length+(novos.length===1?' registro deste aparelho foi enviado':' registros deste aparelho foram enviados')+' para a nuvem.');
}
(async()=>{
  const db=window.claude?.use ? await window.claude.use('db').catch(()=>null) : null;
  if(!db){ setSync('off'); return; }
  col=db.collection('registros'); setSync('sync');
  let primeira=true;
  col.onSnapshot(snap=>{
    const remotos=snap.docs.map(d=>limpo(d.data()));
    if(primeira && !snap.metadata.fromCache){ primeira=false; enviarLocais(remotos); }
    lista=remotos; store.set(lista);
    // registro novo aberto na tela: evita repetir um número que outro aparelho já usou
    if(atual && !lista.some(o=>o.id===atual.id) && lista.some(o=>o.num===atual.num)){ atual.num=proxNum(); $('#doc-num').textContent='Nº '+pad(atual.num); agendarLive(); }
    renderLista(); renderResumo();
    if($('#sync').className!=='sync ro') setSync(snap.metadata.fromCache?'sync':'ok');
  }, ()=>setSync('err'));
})();
setSync('sync');

// ---------- resumo mensal ----------
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
let mesSel=hoje().slice(0,7);
const mesAdd=(m,n)=>{ const [y,mm]=m.split('-').map(Number), d=new Date(y,mm-1+n,1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); };
const mesNome=(m,curto)=>{ const [y,mm]=m.split('-').map(Number), n=MESES[mm-1]; return curto?n.slice(0,3):n.charAt(0).toUpperCase()+n.slice(1)+' de '+y; };
function doMes(m){
  const regs=lista.filter(o=>(o.data||'').slice(0,7)===m);
  const s={regs,n:regs.length,fat:0,pecas:0,serv:0};
  regs.forEach(o=>{ const t=totais(o); s.fat+=t.total; s.pecas+=t.pecas; s.serv+=t.serv; });
  return s;
}
const pct=(a,b)=>b?Math.round(a/b*100):0;
const brlCurto=v=>v>=1000?'R$ '+(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:v>=10000?0:1})+' mil':'R$ '+Math.round(v);
function renderResumo(){
  if($('#view-res').hidden) return;
  const cur=hoje().slice(0,7), m=mesSel, s=doMes(m), ant=doMes(mesAdd(m,-1));
  $('#mes-titulo').textContent=mesNome(m);
  $('#mes-prox').disabled=m>=cur;
  let delta='Sem registros no mês anterior';
  if(ant.fat){ const d=Math.round((s.fat-ant.fat)/ant.fat*100); delta=(d>=0?'▲ ':'▼ ')+Math.abs(d)+'% em relação a '+MESES[Number(mesAdd(m,-1).slice(5))-1]; }
  $('#kpis').innerHTML=`
    <div class="kpi main"><small>Faturamento do mês</small><b>${brl(s.fat)}</b><span>${delta}</span></div>
    <div class="kpi"><small>Mão de obra</small><b>${brl(s.serv)}</b><span>${pct(s.serv,s.fat)}% do total</span></div>
    <div class="kpi"><small>Peças</small><b>${brl(s.pecas)}</b><span>${pct(s.pecas,s.fat)}% do total</span></div>
    <div class="kpi n"><small>Carros atendidos</small><b>${s.n}</b><span>${s.n?'Média de '+brl(s.fat/s.n)+' por carro':'Nenhum registro'}</span></div>`;
  renderGrafico(cur);
  $('#res-n').textContent=s.n?s.n+(s.n===1?' registro':' registros'):'';
  const regs=s.regs.slice().sort((a,b)=>b.data.localeCompare(a.data)||b.num-a.num);
  $('#res-lista').innerHTML=regs.length?regs.map(o=>`<button class="res-row" data-id="${o.id}">
      <span class="dt">${dataBR(o.data).slice(0,5)}</span><span class="nm">${esc(nomeProprio(o.nome))}</span><span class="vl">${brl(totais(o).total)}</span>
      <span class="vh">Nº ${pad(o.num)} · ${esc(veiculo(o))}${o.placa?' · '+esc(fmtPlaca(o.placa)):''}${o.exemplo?' · exemplo':''}</span></button>`).join('')
    :'<div class="empty">Nenhum registro em '+mesNome(m).toLowerCase()+'.</div>';
  const ex=s.regs.some(o=>o.exemplo);
  $('#res-nota').hidden=!ex; $('#res-nota').textContent=ex?'Este mês inclui registros de exemplo. Apague-os em Salvos para ver só os ganhos reais.':'';
}
function renderGrafico(cur){
  let fim=mesSel>cur?mesSel:cur; if(mesSel<mesAdd(fim,-11)) fim=mesAdd(mesSel,11);
  const meses=[...Array(12)].map((_,i)=>mesAdd(fim,i-11)), dados=meses.map(m=>({m,...doMes(m)}));
  const W=Math.max(300,Math.round($('#graf').clientWidth||720)),H=W<500?200:230,L=58,R=8,T=26,B=28, iw=W-L-R, ih=H-T-B, max=Math.max(...dados.map(d=>d.fat),0);
  const passo=(()=>{ if(!max) return 1000; const bruto=max/4, p=Math.pow(10,Math.floor(Math.log10(bruto))); return [1,2,2.5,5,10].map(k=>k*p).find(v=>v>=bruto); })();
  const topo=passo*Math.max(1,Math.ceil(max/passo)), y=v=>T+ih-(v/topo)*ih, band=iw/12, bw=Math.min(34,band*.62);
  let g='';
  for(let v=0;v<=topo+1e-9;v+=passo){ const yy=y(v).toFixed(1);
    g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke-width="1" style="stroke:var(${v?'--g-grade':'--g-eixo'})"/><text x="${L-8}" y="${(+yy+4).toFixed(1)}" text-anchor="end" font-size="11" style="fill:var(--muted)">${v?brlCurto(v):'R$ 0'}</text>`; }
  dados.forEach((d,i)=>{
    const cx=L+band*i+band/2, x=cx-bw/2, sel=d.m===mesSel, h=d.fat?Math.max(3,(d.fat/topo)*ih):0, y0=T+ih, r=Math.min(4,h/2);
    const path=h?`M${x},${y0} V${y0-h+r} Q${x},${y0-h} ${x+r},${y0-h} H${x+bw-r} Q${x+bw},${y0-h} ${x+bw},${y0-h+r} V${y0} Z`:'';
    g+=`<g class="bar" data-i="${i}"><rect class="hit" x="${(L+band*i).toFixed(1)}" y="${T}" width="${band.toFixed(1)}" height="${ih+B}" fill="transparent" tabindex="0" role="button" aria-label="${mesNome(d.m)}: ${brl(d.fat)}"/>`
      +(path?`<path d="${path}" style="fill:var(${sel?'--red':'--g-barra'})"/>`:`<rect x="${x}" y="${y0-1}" width="${bw}" height="1" style="fill:var(--g-eixo)"/>`)
      +`<text x="${cx.toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="11" style="fill:var(${sel?'--ink':'--muted'})" font-weight="${sel?700:400}">${mesNome(d.m,true)}</text>`
      +(sel&&d.fat?`<text x="${(cx>W-46?W-R:cx).toFixed(1)}" y="${(y0-h-7).toFixed(1)}" text-anchor="${cx>W-46?'end':'middle'}" font-size="11" font-weight="700" style="fill:var(--ink)">${brlCurto(d.fat)}</text>`:'')+`</g>`;
  });
  $('#graf').innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Faturamento dos últimos 12 meses">${g}</svg><div class="tip" hidden></div>`;
  const svg=$('#graf svg'), tip=$('#graf .tip');
  const mostrarTip=i=>{ const d=dados[i], r=svg.getBoundingClientRect(), k=r.width/W, cx=(L+band*i+band/2)*k, top=(d.fat?y(d.fat):T+ih)*k;
    tip.innerHTML=`<div>${mesNome(d.m)}</div><div>Total <b>${brl(d.fat)}</b></div><div>Mão de obra ${brl(d.serv)} · Peças ${brl(d.pecas)}</div><div>${d.n} ${d.n===1?'carro':'carros'}</div>`;
    tip.hidden=false; tip.style.left=Math.min(Math.max(cx,90),r.width-90)+'px'; tip.style.top=(top-8)+'px'; };
  svg.querySelectorAll('.bar').forEach(b=>{ const i=+b.dataset.i, hit=b.querySelector('.hit');
    hit.addEventListener('mouseenter',()=>mostrarTip(i)); hit.addEventListener('focus',()=>mostrarTip(i));
    hit.addEventListener('mouseleave',()=>tip.hidden=true); hit.addEventListener('blur',()=>tip.hidden=true);
    const escolher=()=>{ mesSel=dados[i].m; renderResumo(); };
    hit.addEventListener('click',escolher); hit.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); escolher(); } });
  });
}
$('#mes-ant').onclick=()=>{ mesSel=mesAdd(mesSel,-1); renderResumo(); };
$('#mes-prox').onclick=()=>{ mesSel=mesAdd(mesSel,1); renderResumo(); };

let tt; function toast(m,ms,acao){
  const t=$('#toast'); t.textContent=m;
  if(acao){ const b=document.createElement('button'); b.className='t-acao'; b.textContent=acao.rotulo; b.onclick=()=>{ t.hidden=true; acao.fn(); }; t.appendChild(b); }
  t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,ms||2600);
}
